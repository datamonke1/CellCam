name: BlobCam
options:
  bundleIdPrefix: dev.datamonke1
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
targets:
  BlobCam:
    type: application
    platform: iOS
    sources:
      - path: Sources/BlobCam
    # Copy the token into the app only when the gitignored file exists.
    # Cloud builds have no token and still succeed.
    postBuildScripts:
      - name: Bundle GitHub token if present
        basedOnDependencyAnalysis: false
        script: |
          TOKEN="${SRCROOT}/secrets/github-token.txt"
          DEST="${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/github-token.txt"
          if [ -f "$TOKEN" ]; then
            cp "$TOKEN" "$DEST"
          fi
    info:
      path: Sources/BlobCam/Info.plist
      properties:
        CFBundleDisplayName: BlobCam
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "BlobCam uses the camera to take hourly photos of your blob."
        NSPhotoLibraryAddUsageDescription: "BlobCam saves the timelapse photos to your photo library."
        NSPhotoLibraryUsageDescription: "BlobCam saves the timelapse photos to your photo library."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        # Bundle ID intentionally unchanged: updating keeps photos + settings.
        PRODUCT_BUNDLE_IDENTIFIER: dev.datamonke1.cellcam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
